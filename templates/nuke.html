{% extends "base.html" %}

{% block title %}Nuke Activation Console{% endblock %}

{% block content %}
<section id="nuke" class="mt-5 pt-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-12">

        <div class="card shadow-sm border-0">
          <div class="card-body">

            <h3 class="text-uppercase fw-semibold mb-4 text-center">Nuke Activation Console</h3>

            <form method="POST" class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Submarine ID</label>
                <input type="text" name="submarine_id" class="form-control" placeholder="XXXXXXXX-XX" required>
              </div>

              <div class="col-md-4">
                <label class="form-label">Secret Key</label>
                <input type="text" name="secret_key" class="form-control" placeholder="Enter Secret Key" required>
              </div>

              <div class="col-md-4">
                <label class="form-label">Activation Code</label>
                <input type="text" name="activation_code" class="form-control" placeholder="Enter Activation Code" required>
              </div>

              <div class="col-12 d-grid">
                <button type="submit" class="btn btn-danger fw-bold">
                  Execute Launch
                </button>
              </div>
            </form>

            {% if result %}
              <div class="mt-4">
                {% if result.status == "success" %}
                  <div class="alert alert-success">
                    <strong>{{ result.message }}</strong><br>
                    Hash: <code>{{ result.hash }}</code>
                  </div>
                {% else %}
                  <div class="alert alert-danger">
                    {{ result.message }}
                  </div>
                {% endif %}
              </div>
            {% endif %}

          </div>
        </div>

      </div>
    </div>
  </div>
</section>
{% endblock %}
